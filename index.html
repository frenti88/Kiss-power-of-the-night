<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08080c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>KISS: POWER OF THE NIGHT - Un Run & Gun Retro de Rock y Terror</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        -webkit-touch-callout: none;
      }
      html, body {
        background-color: #000000;
        color: #f0f0f0;
        font-family: 'Press Start 2P', 'Courier New', monospace;
        width: 100vw;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        position: fixed;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
      }
      #game-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        display: block;
        background: #000000;
      }
      canvas#game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        height: 100%;
        display: block;
        margin: 0;
        padding: 0;
        border: 0;
        outline: none;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      #ui-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        box-sizing: border-box;
      }
      #debug-info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #00ff66;
        font-size: 10px;
        font-family: monospace;
        background: rgba(0, 0, 0, 0.85);
        padding: 6px 10px;
        border-radius: 0px;
        display: none;
        pointer-events: none;
        z-index: 1000;
        border: 2px solid #00aa44;
      }

      /* Global Top Bar Controls (Fullscreen + Music Toggle) */
      #top-bar-controls {
        position: absolute;
        top: max(env(safe-area-inset-top, 10px), 10px);
        right: max(env(safe-area-inset-right, 14px), 14px);
        z-index: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: right 0.2s ease, left 0.2s ease, transform 0.2s ease;
      }
      body.in-gameplay #top-bar-controls {
        right: auto;
        left: 50%;
        transform: translateX(-50%);
      }
      #fullscreen-btn, #music-btn, #pause-btn {
        background: rgba(10, 8, 16, 0.85);
        border: 2px solid #555;
        font-family: 'Press Start 2P', monospace;
        font-size: 9px;
        padding: 6px 10px;
        cursor: pointer;
        box-shadow: 0 3px 0 #000;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
        border-radius: 2px;
      }
      #fullscreen-btn {
        color: #ffd700;
      }
      #fullscreen-btn:hover {
        background: rgba(30, 25, 45, 0.95);
        border-color: #ffd700;
      }
      #music-btn {
        color: #00ffcc;
      }
      #music-btn:hover {
        background: rgba(30, 25, 45, 0.95);
        border-color: #00ffcc;
      }
      #music-btn.muted {
        color: #888888;
        border-color: #444;
      }
      #music-btn.muted:hover {
        color: #ff4466;
        border-color: #ff4466;
      }
      #pause-btn {
        color: #ff9900;
      }
      #pause-btn:hover {
        background: rgba(30, 25, 45, 0.95);
        border-color: #ff9900;
      }
      #fullscreen-btn:active, #music-btn:active, #pause-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #000;
      }

      /* Portrait Orientation Warning (Mobile Screens) */
      #orientation-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(5, 2, 8, 0.98);
        z-index: 9999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 24px;
        color: #ffd700;
      }
      @media screen and (orientation: portrait) and (max-width: 800px) {
        #orientation-overlay {
          display: flex !important;
        }
      }
      .rotate-phone-anim {
        font-size: 48px;
        animation: rotateIcon 2s ease-in-out infinite;
        margin-bottom: 18px;
      }
      @keyframes rotateIcon {
        0%, 20% { transform: rotate(0deg); }
        50%, 80% { transform: rotate(90deg); }
        100% { transform: rotate(0deg); }
      }
    </style>
  </head>
  <body>
    <!-- Orientation Rotation Warning for Mobile Portrait -->
    <div id="orientation-overlay">
      <div class="rotate-phone-anim">📱 ➔ 🔄</div>
      <div style="font-size: 14px; margin-bottom: 12px; color: #ff2a55; text-shadow: 2px 2px 0 #000;">
        POR FAVOR GIRA TU DISPOSITIVO
      </div>
      <div style="font-size: 10px; color: #fff; line-height: 1.6; max-width: 320px; text-shadow: 1px 1px 0 #000;">
        PARA UNA EXPERIENCIA RETRO ARCADE DE 16 BITS ÓPTIMA, JUEGA EN MODO HORIZONTAL.
      </div>
    </div>

    <!-- Main Game Container -->
    <div id="game-container">
      <div id="top-bar-controls">
        <button id="fullscreen-btn" title="Pantalla Completa">
          <span>⛶</span>
          <span class="fs-label">PANTALLA</span>
        </button>
        <button id="music-btn" title="Alternar Música [M]">
          <span id="music-btn-icon">🔊</span>
          <span id="music-btn-label">MÚSICA: SÍ</span>
        </button>
        <button id="pause-btn" title="Pausar Juego [ESC]" style="display: none;">
          <span>⏸</span>
          <span class="pause-label">PAUSA</span>
        </button>
      </div>

      <canvas id="game-canvas"></canvas>
      <div id="ui-overlay"></div>
      <div id="debug-info"></div>
    </div>

    <script>
      // Fullscreen handling
      const fsBtn = document.getElementById('fullscreen-btn');
      if (fsBtn) {
        fsBtn.onclick = (e) => {
          e.stopPropagation();
          const doc = document;
          const container = document.getElementById('game-container') || document.documentElement;
          if (!doc.fullscreenElement && !(doc).webkitFullscreenElement) {
            if (container.requestFullscreen) {
              container.requestFullscreen().catch(() => {});
            } else if (container.webkitRequestFullscreen) {
              container.webkitRequestFullscreen();
            }
          } else {
            if (doc.exitFullscreen) {
              doc.exitFullscreen().catch(() => {});
            } else if (doc.webkitExitFullscreen) {
              doc.webkitExitFullscreen();
            }
          }
        };
      }

      // Prevent accidental browser pull-to-refresh, pinch-zoom, and rubber-banding
      document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      let lastTouchTime = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchTime <= 300) {
          e.preventDefault();
        }
        lastTouchTime = now;
      }, { passive: false });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
